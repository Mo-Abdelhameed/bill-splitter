[project]
name = "bill-split-backend"
version = "0.1.0"
description = "Bill Split backend — stateless proxy from Flutter app to Gemini 2.5 Flash, gated by Firebase Anonymous Auth."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-generativeai>=0.8.3",
    "firebase-admin>=6.5.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
