name: bill_splitter
description: "Bill Splitter — split restaurant bills among multiple people."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  dio: ^5.7.0
  image_picker: ^1.1.2
  image: ^4.3.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  shared_preferences: ^2.3.3
  intl: ^0.20.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
